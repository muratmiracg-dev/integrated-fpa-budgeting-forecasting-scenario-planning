name: FP&A quality checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check Python
      - name: Rebuild analytical pipeline
        run: PYTHONPATH=Python/src python -m fpa_system.run_pipeline
      - name: Run financial-control tests
        run: PYTHONPATH=Python/src pytest -q
