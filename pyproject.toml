[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "integrated-fpa-planning-system"
version = "1.0.0"
description = "Portfolio-grade FP&A budgeting, rolling forecast and scenario planning system."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
]

[tool.setuptools]
package-dir = {"" = "Python/src"}

[tool.setuptools.packages.find]
where = ["Python/src"]

[tool.pytest.ini_options]
testpaths = ["Python/tests"]
pythonpath = ["Python/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
